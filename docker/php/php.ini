; Screenshots are limited to 5 MB by validation; leave headroom for the rest of the form.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M

; Development-friendly OPcache: cache compiled scripts but re-check timestamps.
opcache.enable = 1
; Also for the CLI, so artisan commands and the test suite do not re-read files from the bind mount.
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
