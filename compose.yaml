# Explicit project name so containers, volumes and images never collide with another
# checkout that happens to live in a folder with the same name.
name: public-bug-reporting

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      # Keep vendor/ on the container filesystem: loading thousands of PHP files through a
      # Windows/macOS bind mount makes every request several times slower.
      - vendor:/var/www/html/vendor
    environment:
      # Set to "false" when migrations are run as a separate deployment step.
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bug_reporting
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d bug_reporting"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  node:
    image: node:22-alpine
    # Forward stop signals to Vite so it removes public/hot on shutdown; a stale hot file
    # would make Laravel load assets from a dev server that is no longer running.
    init: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      # Same port inside and outside: the browser loads dev assets from it directly.
      - "${DEV_SERVER_PORT:-5173}:${DEV_SERVER_PORT:-5173}"
    environment:
      DEV_SERVER_PORT: "${DEV_SERVER_PORT:-5173}"
      # File change events from the host are not always delivered into the container, so poll instead.
      WATCH_POLLING: "true"
      # Host the browser loads Vite assets from; set to the machine's LAN IP to test from a phone.
      HMR_HOST: "${HMR_HOST:-localhost}"
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
  vendor:
